apiVersion: apps/v1
kind: Deployment
metadata:
  name: uamichat-server
  namespace: uamichat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uamichat-server
  template:
    metadata:
      labels:
        app: uamichat-server
    spec:
      containers:
      - name: uamichat-server
        image: ghcr.io/uami-11/uamichat-server:latest
        ports:
        - containerPort: 8765
        env:
        - name: TZ
          value: Asia/Kathmandu
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: uamichat-secrets
              key: DB_URL
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "8765"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
