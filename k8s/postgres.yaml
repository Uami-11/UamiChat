apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: uamichat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - name: TZ
          value: Asia/Kathmandu
        - name: POSTGRES_DB
          value: uamichat
        - name: POSTGRES_USER
          value: uami
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uamichat-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: schema
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: schema
        configMap:
          name: schema-sql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: uamichat
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: uamichat
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
